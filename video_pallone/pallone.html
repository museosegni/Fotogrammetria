<script>
const SC=[{"start": 0, "dur": 6.07}, {"start": 6.07, "dur": 4.08}, {"start": 10.15, "dur": 8.71}, {"start": 18.86, "dur": 5.77}];               // [{start,dur}] in secondi
const TOTAL=SC[3].start+SC[3].dur;
const CAPS=["A pallone si gioca in due","Niente pallone? Non si gioca più",
  "Manca una squadra? Si aspetta che arrivi","Due squadre + un pallone = si gioca!"];
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>{k=cl(k);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2};
const back=k=>{k=cl(k);const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const R=[[130,320],[300,170],[300,470],[480,250],[480,390]];
const B=R.map(([x,y])=>[1280-x,y]);
function el(tag,attrs,parent,txt){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;parent.appendChild(e);return e}
function mkTeam(g,pts,col){return pts.map((p,i)=>{const n=el("g",{},g);
  el("ellipse",{cx:4,cy:26,rx:24,ry:8,fill:"#000",opacity:.25},n);
  el("circle",{r:26,fill:col,stroke:"#fff","stroke-width":4},n);
  el("text",{y:9,"font-size":24,"text-anchor":"middle",fill:"#fff"},n,i+1);return n})}
const rn=mkTeam($("red"),R,"#d62828"),bn=mkTeam($("blue"),B,"#1d4ed8");
B.forEach(p=>el("circle",{cx:p[0],cy:p[1],r:26,fill:"none",stroke:"#fff","stroke-width":3,"stroke-dasharray":"8 7",opacity:.8},$("ghosts")));
[...R,...B].forEach(p=>el("text",{x:p[0]+22,y:p[1]-30,"font-size":34,fill:"#ffd60a",stroke:"#1b1b1b","stroke-width":1.5},$("qmarks"),"?"));
const capN=CAPS.map(c=>{const g=el("g",{opacity:0},$("caps"));
  el("rect",{x:90,y:622,width:1100,height:76,rx:38,fill:"#fff"},g);
  el("text",{x:640,y:674,"font-size":40,"text-anchor":"middle",fill:"#0d2818"},g,c);return g});
// sequenza passaggi: alterna le due squadre
const PASS=[R[3],B[4],R[4],B[3],R[1],B[2],R[2],B[1]];
function passPos(u){const step=.75,i=Math.floor(u/step),k=ease((u-i*step)/step*1.25);
  const a=PASS[i%PASS.length],b=PASS[(i+1)%PASS.length];
  return [lerp(a[0],b[0],k)+(b[0]>a[0]?-34:34)*(k>=1?1:k), lerp(a[1],b[1],k)];}
function render(t){
  t=cl(t,0,TOTAL-.001);
  let s=3;while(s>0&&t<SC[s].start)s--;
  const u=t-SC[s].start,d=SC[s].dur,left=d-u;
  let redOff=0,blueOff=0,bx=640,by=320,bs=1,spin=0,bob=0,
      missing=0,stop=0,q=0,clock=0,ghost=0,ok=0;
  if(s==0){redOff=-750*(1-ease(u/1.2));blueOff=750*(1-ease(u/1.2));
    bs=back((u-1.0)/.5);if(u<1)bs=0;
    if(u>1.7){[bx,by]=passPos(u-1.7);spin=(u-1.7)*300;bob=1}
  }else if(s==1){const p=passPos(SC[0].dur-1.7);        // il pallone sparisce da dove era
    bx=p[0];by=p[1];bs=1-ease(u/.45);
    missing=ease((u-.5)/.4);q=ease((u-.7)/.4);stop=ease((u-1.4)/.5);
    const out=ease((.5-left)/.5);missing*=1-out;q*=1-out;stop*=1-out;
  }else if(s==2){bs=back(u/.5);
    const arr=ease((1.7-left)/1.4);                      // la squadra blu arriva a fine scena
    blueOff=750*(1-arr);ghost=ease(u/.4)*(1-arr);clock=ease((u-.2)/.4)*(1-ease((1.9-left)/.4));
    $("hMin").setAttribute("transform",`rotate(${u*220} 930 320)`);
    $("hHour").setAttribute("transform",`rotate(${u*220/12+60} 930 320)`);
    bob=.5;
  }else{[bx,by]=passPos(u);spin=u*300;bob=1;ok=back((u-.3)/.5);if(u<.3)ok=0;
    $("okIn").setAttribute("transform",`scale(${ok})`);}
  const place=(nodes,pts,off,ph)=>nodes.forEach((n,i)=>{
    const dy=bob*Math.sin(t*5+i*1.3+ph)*5,dx=bob*Math.cos(t*3+i+ph)*6;
    n.setAttribute("transform",`translate(${pts[i][0]+off+dx} ${pts[i][1]+dy})`)});
  place(rn,R,redOff,0);place(bn,B,blueOff,2);
  $("ball").setAttribute("transform",`translate(${bx} ${by}) scale(${Math.max(bs,0)})`);
  $("ballSpin").setAttribute("transform",`rotate(${spin})`);
  $("missing").setAttribute("opacity",missing);$("qmarks").setAttribute("opacity",q);
  $("stop").setAttribute("opacity",stop);$("stopIn").setAttribute("transform",`scale(${.7+.3*back(stop)})`);
  $("clock").setAttribute("opacity",clock);$("ghosts").setAttribute("opacity",ghost);
  $("ok").setAttribute("opacity",s==3?cl(ok):0);
  capN.forEach((g,i)=>{const o=i==s?ease(u/.4)*(i<3?ease(left/.3):1):0;
    g.setAttribute("opacity",o);g.setAttribute("transform",`translate(0 ${(1-o)*20})`)});
}
window.render=render;render(0);
const aud=$("aud");let run=false;
function loop(){render(aud.currentTime);if(!aud.ended)requestAnimationFrame(loop);else{run=false;$("play").style.display=""}}
if(location.hash=="#capture")$("play").style.display="none";
$("s").addEventListener("click",()=>{if(run)return;run=true;$("play").style.display="none";aud.currentTime=0;aud.play();loop()});
</script></body></html>
